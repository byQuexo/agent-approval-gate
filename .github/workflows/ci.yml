name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/rig-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --features "rig yaml"
      - run: cargo clippy --features "rig yaml" -- -D warnings
