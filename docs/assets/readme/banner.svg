<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="agent-approval-gate: human-in-the-loop approval for LLM agent tool calls. Reads run, writes wait for a human, every failure is a denial.">
  <title>agent-approval-gate: human-in-the-loop approval for LLM agent tool calls</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="0.45" stop-color="#7c2d12"/>
      <stop offset="0.78" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.88" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" opacity="0.12"/></pattern>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="r"><rect width="1280" height="380" rx="18"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0c0a09" flood-opacity="0.5"/></filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#g1)"/>
    <rect width="1280" height="380" fill="url(#g2)"/>
    <rect width="1280" height="380" fill="url(#dots)"/>

    <!-- pause / hold icon -->
    <g transform="translate(78,100)" filter="url(#sh)">
      <rect x="0" y="0" width="150" height="150" rx="36" fill="url(#icon)"/>
      <rect x="44" y="38" width="22" height="74" rx="8" fill="#fff"/>
      <rect x="84" y="38" width="22" height="74" rx="8" fill="#fff"/>
    </g>

    <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="268" y="150" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">agent-approval-gate</text>
      <text x="272" y="204" font-size="30" font-weight="600" fill="#ffedd5">Human-in-the-loop approval for agent tool calls.</text>
      <text x="272" y="248" font-size="21" fill="#fed7aa">Reads run freely. Writes and destructive calls wait for a human.</text>
      <text x="272" y="278" font-size="21" fill="#fed7aa">One approval covers exactly one call, and every failure is a denial.</text>

      <g font-size="16" font-weight="700">
        <rect x="1000" y="84" width="220" height="44" rx="22" fill="#10b981" fill-opacity="0.92"/>
        <text x="1110" y="112" text-anchor="middle" fill="#fff">read → runs</text>
        <rect x="1000" y="144" width="220" height="44" rx="22" fill="#f59e0b" fill-opacity="0.95"/>
        <text x="1110" y="172" text-anchor="middle" fill="#fff">write → asks a human</text>
        <rect x="1000" y="204" width="220" height="44" rx="22" fill="#ef4444" fill-opacity="0.92"/>
        <text x="1110" y="232" text-anchor="middle" fill="#fff">destructive → always asks</text>
        <text x="1110" y="290" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="600">TypeScript · Rust · MCP · AI SDK · Rig</text>
      </g>
    </g>
  </g>
</svg>
