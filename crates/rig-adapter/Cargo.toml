[package]
name = "agent-approval-gate"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Human-in-the-loop approval gate for LLM agent tool calls (Rust core + Rig adapter)."
repository = "https://github.com/byQuexo/agent-approval-gate"
readme = "README.md"
keywords = ["llm", "agent", "tools", "human-in-the-loop", "rig"]
categories = ["asynchronous"]

[dependencies]
async-trait = "0.1"
serde_json = "1"

# Enable the Rig adapter with `--features rig`, YAML policies with `--features yaml`.
serde = { version = "1", features = ["derive"], optional = true }
serde_yaml = { version = "0.9", optional = true }
rig-core = { version = "0.40", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = []
rig = ["dep:rig-core", "dep:serde"]
yaml = ["dep:serde", "dep:serde_yaml"]
